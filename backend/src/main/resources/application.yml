spring:
  application:
    name: aniol-stroz
  threads:
    virtual:
      enabled: true # BE-02
  profiles:
    default: dev
  jackson: # CON-04: camelCase fields, enums by name (Jackson defaults)
    serialization:
      write-dates-as-timestamps: false
    generator:
      write-bigdecimal-as-plain: true # costs such as 0.000012 stay plain numbers (OBS-04)
    deserialization:
      fail-on-unknown-properties: true

  datasource: # BE-07: SQLite file in the working directory, one connection (single writer)
    url: jdbc:sqlite:${APP_DB_FILE:aniol.db}
    hikari:
      maximum-pool-size: 1
  sql:
    init:
      mode: always # schema.sql uses CREATE TABLE IF NOT EXISTS

server:
  forward-headers-strategy: framework # API-04: behind a reverse proxy with HTTPS

management:
  endpoints:
    web:
      exposure:
        include: health # OBS-05

# Defaults for app.* live in AppProperties (mode=SCRIPTED, claude.model, claude.timeout-ms).
# Override with APP_MODE, APP_CLAUDE_MODEL, APP_CLAUDE_TIMEOUT_MS. Secrets only come from the environment.
# app.retention.days: 1-90 (default 30), APP_RETENTION_DAYS (DAT-02).
# app.events.*: allowed-origins (empty = same origin), send-time-limit-ms, buffer-size-limit-bytes, heartbeat-interval-ms.
