spring:
  application:
    name: hackathon-starter
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hackathon}
    username: ${DB_USER:hackathon}
    password: ${DB_PASSWORD:hackathon}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

app:
  llm:
    provider: ${LLM_PROVIDER:anthropic}
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
    max-tokens: ${LLM_MAX_TOKENS:1024}
    timeout: ${LLM_TIMEOUT:60s}
    anthropic-version: "2023-06-01"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    com.hackathonstarter: ${LOG_LEVEL:INFO}
